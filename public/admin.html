<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit resume</title><style>body{font:16px Arial;max-width:900px;margin:30px auto;padding:0 20px;color:#152c46}textarea{width:100%;min-height:420px;font:14px monospace}button{padding:12px 18px;margin:10px 10px 10px 0}.status{font-weight:600}</style></head><body><a href="/">← View resume</a><h1>Edit resume</h1><p>Sign in through Netlify Identity, then edit the resume JSON below. Upload a photo and paste the returned URL into the <code>photo</code> field.</p><button id="login">Sign in</button><button id="logout">Sign out</button><input id="file" type="file" accept="image/*"><button id="upload">Upload photo</button><p class="status" id="status"></p><textarea id="data"></textarea><button id="save">Save changes</button><script type="module">import{getUser,login,logout}from'https://cdn.jsdelivr.net/npm/@netlify/identity@2.0.0/+esm';const status=document.querySelector('#status'),data=document.querySelector('#data');let revision=0;async function load(){const r=await fetch('/api/resume');const j=await r.json();revision=j.revision||0;data.value=JSON.stringify(j.resume||{},null,2)}document.querySelector('#login').onclick=async()=>{const e=prompt('Netlify email'),p=prompt('Netlify password');if(e&&p)try{await login(e,p);status.textContent='Signed in.'}catch(x){status.textContent=x.message}};document.querySelector('#logout').onclick=()=>logout();document.querySelector('#upload').onclick=async()=>{const f=document.querySelector('#file').files[0];if(!f)return status.textContent='Choose a photo first.';const u=await getUser();if(!u)return status.textContent='Sign in first.';const r=await fetch('/api/photo',{method:'POST',headers:{'Content-Type':f.type},body:f});const j=await r.json();if(j.url){const x=JSON.parse(data.value);x.photo=j.url;data.value=JSON.stringify(x,null,2);status.textContent='Photo uploaded. Save changes.'}else status.textContent=j.error||'Upload failed.'};document.querySelector('#save').onclick=async()=>{try{const u=await getUser();if(!u)return status.textContent='Sign in first.';const r=await fetch('/api/resume',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume:JSON.parse(data.value),revision})});const j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');revision=j.revision;status.textContent='Saved.'}catch(x){status.textContent=x.message}};load();</script></body></html>
